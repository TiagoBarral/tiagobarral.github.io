<header class="topbar">
  <a class="brand" href="{{ site.Home.RelPermalink }}">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-text">
      <span class="brand-sub">Vol. 03 · Issue 14</span>
      <strong>{{ upper site.Title }}</strong>
    </span>
  </a>
  <nav class="site-nav" aria-label="Main navigation">
    {{ range site.Menus.main }}
      <a href="{{ .URL }}"{{ if $.IsMenuCurrent .Menu . }} class="cur" aria-current="page"{{ end }}>{{ .Name }}</a>
    {{ end }}
  </nav>
</header>
